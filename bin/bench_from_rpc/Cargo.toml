[package]
name = "bench_from_rpc"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "bench_from_rpc"
path = "src/main.rs"

[dependencies]
tokio.workspace = true
url.workspace = true
tracing.workspace = true
tracing-subscriber = "0.3.18"
clap = { version = "4.5.7", features = ["derive"] }
eyre = "0.6.12"
bincode = "1.3"
hex = "0.4"
async-trait.workspace = true

# rsp
rsp-client-executor.workspace = true
rsp-host-executor.workspace = true
rsp-mpt.workspace = true
rsp-primitives.workspace = true
rsp-provider.workspace = true
rsp-rpc-db = { path = "../../crates/storage/rpc-db", default-features = false }

# alloy
alloy-primitives.workspace = true
alloy-consensus.workspace = true
alloy-provider.workspace = true
alloy-network.workspace = true
alloy-rlp.workspace = true
alloy-eips.workspace = true

# reth
reth-chainspec.workspace = true
reth-ethereum-primitives.workspace = true
reth-primitives-traits.workspace = true
reth-evm.workspace = true
reth-evm-ethereum.workspace = true
reth-trie.workspace = true

# revm
revm.workspace = true
revm-database.workspace = true
revm-primitives.workspace = true
revm-state.workspace = true
